<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - STREAMING HOME HUB</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .admin-header { background: #a200ff; padding: 15px; text-align: center; font-weight: bold; box-shadow: 0 0 15px rgba(162,0,255,0.5); }
        .admin-panel { display: flex; flex-direction: row; gap: 20px; padding: 30px 5%; max-width: 1300px; margin: 0 auto; }\
        .admin-form { background: #13131a; padding: 25px; border-radius: 8px; width: 35%; border: 1px solid #a200ff; box-shadow: 0 0 10px rgba(162,0,255,0.2); height: fit-content; }
        .admin-table-container { background: #13131a; padding: 25px; border-radius: 8px; width: 65%; border: 1px solid #222230; }
        h2 { margin-bottom: 20px; color: #ffffff; font-size: 22px; border-bottom: 1px solid #222230; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8b8b9a; font-size: 14px; }
        input, select { width: 100%; padding: 10px; background: #0b0b0f; border: 1px solid #222230; border-radius: 5px; color: #fff; font-size: 15px; }
        input:focus, select:focus { border-color: #a200ff; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: #a200ff; border: none; border-radius: 5px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #b324ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222230; }
        th { color: #8b8b9a; font-size: 14px; font-weight: 600; }
        td { color: #ffffff; font-size: 14px; vertical-align: middle; }
        .btn-delete { background: none; border: none; color: #ff0055; cursor: pointer; font-size: 16px; }
        .btn-delete:hover { color: #ff3377; }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1><i class="fas fa-user-shield"></i> PANEL DE ADMINISTRACIÓN - STREAMING HOME HUB</h1>
    </header>

    <main class="admin-panel">
        <section class="admin-form">
            <h2><i class="fas fa-plus-circle"></i> Asignar Cuenta</h2>
            <form id="form-admin" onsubmit="guardarServicio(event)">
                <div class="form-group">
                    <label>Usuario / Celular del Cliente:</label>
                    <input type="text" id="admin-user" required placeholder="Ej. 916982923">
                </div>
                <div class="form-group">
                    <label>Contraseña Web del Cliente:</label>
                    <input type="text" id="admin-pass" required placeholder="Ej. clave123">
                </div>
                <div class="form-group">
                    <label>Plataforma Vendida:</label>
                    <select id="admin-plataforma">
                        <option>Netflix Premium</option>
                        <option>Disney+</option>
                        <option>Max</option>
                        <option>Crunchyroll+</option>
                        <option>Prime Video</option>
                        <option>Paramount+</option>
                        <option>Vix Premium</option>
                        <option>Canva Pro</option>
                        <option>Spotify Premium</option>
                        <option>YouTube Premium</option>
                        <option>IPTV</option>
                        <option>Apple TV+</option>
                        <option>ChatGPT Plus</option>
                        <option>CapCut Pro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Correo de Acceso a la Cuenta:</label>
                    <input type="text" id="admin-acc-correo" required placeholder="cuenta@correo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña de la Cuenta:</label>
                    <input type="text" id="admin-acc-pass" required placeholder="pass123">
                </div>
                <div class="form-group">
                    <label>Nombre del Perfil asignado:</label>
                    <input type="text" id="admin-perfil" required placeholder="Ej. Perfil 3 / Tu Nombre">
                </div>
                <div class="form-group">
                    <label>PIN del Perfil (Si no usa poner s/n):</label>
                    <input type="text" id="admin-pin" required placeholder="Ej. 1234">
                </div>
                <div class="form-group">
                    <label>Días de Duración:</label>
                    <input type="number" id="admin-dias" required value="30">
                </div>
                <button type="submit" class="btn-submit">Registrar / Actualizar</button>
            </form>
        </section>

        <section class="admin-table-container">
            <h2><i class="fas fa-users"></i> Cuentas Entregadas Activas</h2>
            <table id="tabla-usuarios">
                <thead>
                    <tr>
                        <th>Cliente / Web Pass</th>
                        <th>Plataforma</th>
                        <th>Credenciales Cuenta</th>
                        <th>Perfil / PIN</th>
                        <th>Vencimiento</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </main>

    <script>
        // CONFIGURACIÓN DE TU NUEVO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBhJN3z0RKeVyKDILbJ5w6QpCuEKrW3P1E",
            authDomain: "streaming-home-hub-nuevo.firebaseapp.com",
            projectId: "streaming-home-hub-nuevo",
            storageBucket: "streaming-home-hub-nuevo.firebasestorage.app",
            messagingSenderId: "732477886674",
            appId: "1:732477886674:web:fb94a0498e8ec5cdda9d0b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function guardarServicio(event) {
            event.preventDefault();
            
            let user = document.getElementById('admin-user').value.trim().toLowerCase();
            let pass = document.getElementById('admin-pass').value.trim();
            let plataforma = document.getElementById('admin-plataforma').value;
            let accCorreo = document.getElementById('admin-acc-correo').value.trim();
            let accPass = document.getElementById('admin-acc-pass').value.trim();
            let perfil = document.getElementById('admin-perfil').value.trim();
            let pin = document.getElementById('admin-pin').value.trim();
            let dias = parseInt(document.getElementById('admin-dias').value);

            let fechaCompra = new Date();
            let fechaVencimiento = new Date();
            fechaVencimiento.setDate(fechaCompra.getDate() + dias);

            let nuevoServicio = {
                plataforma: plataforma,
                accesoCorreo: accCorreo,
                accesoPass: accPass,
                perfilNombre: perfil,
                perfilPin: pin,
                fechaCompra: fechaCompra.toISOString(),
                fechaVencimiento: fechaVencimiento.toISOString()
            };

            let userRef = db.collection(\"usuarios\").doc(user);

            userRef.get().then((doc) => {
                if (doc.exists) {
                    let datosExistentes = doc.data();
                    let serviciosActualizados = datosExistentes.servicios || [];
                    serviciosActualizados.push(nuevoServicio);
                    
                    userRef.update({
                        password: pass,
                        servicios: serviciosActualizados
                    }).then(() => {
                        alert(\"Servicio agregado exitosamente al cliente existente.\");
                        document.getElementById('form-admin').reset();
                    });
                } else {
                    userRef.set({
                        password: pass,
                        servicios: [nuevoServicio]
                    }).then(() => {
                        alert(\"Nuevo cliente creado y cuenta asignada con éxito.\");
                        document.getElementById('form-admin').reset();
                    });
                }
            }).catch(err => alert(\"Error al guardar: \" + err));
        }

        // LEER LOS USUARIOS Y MOSTRARLOS
        db.collection(\"usuarios\").onSnapshot((snapshot) => {
            let tbody = document.querySelector('#tabla-usuarios tbody');
            tbody.innerHTML = '';

            snapshot.forEach((doc) => {
                let username = doc.id;
                let user = doc.data();

                if(user.servicios && user.servicios.length > 0) {
                    user.servicios.forEach((serv, index) => {
                        let fVenc = new Date(serv.fechaVencimiento);
                        let hoy = new Date();
                        let difTiempo = fVenc.getTime() - hoy.getTime();
                        let diasRestantes = Math.ceil(difTiempo / (1000 * 60 * 60 * 24));

                        let textoDias = diasRestantes > 0 ? `${diasRestantes} días` : \"Vencido\";
                        let colorDias = diasRestantes > 5 ? \"#00ff88\" : \"#ff0055\";

                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${username}</strong> (Clave: ${user.password})</td>
                                <td style="color:#9d4edd; font-weight: bold;">${serv.plataforma}</td>
                                <td>${serv.accesoCorreo}<br><small style="color:#8b8b9a">${serv.accesoPass}</small></td>
                                <td>${serv.perfilNombre}<br><small style="color:#a200ff">PIN: ${serv.perfilPin}</small></td>
                                <td style="color:${colorDias}; font-weight:bold;">${textoDias}</td>
                                <td><button class="btn-delete" onclick="eliminarServicio('${username}', ${index})"><i class="fas fa-trash"></i></button></td>
                            </tr>
                        `;
                    });
                }
            });
        });

        function eliminarServicio(username, index) {
            if(confirm("¿Seguro que deseas eliminar esta cuenta asignada?")) {
                let userRef = db.collection("usuarios").doc(username);

                userRef.get().then((doc) => {
                    if(doc.exists) {
                        let servicios = doc.data().servicios;
                        servicios.splice(index, 1);

                        if(servicios.length === 0) {
                            userRef.delete();
                        } else {
                            userRef.update({ servicios: servicios });
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
