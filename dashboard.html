<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamNeon - Mi Tablero</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="dashboard-body">

    <header class="dash-nav">
        <div class="nav-logo">
            <h1>STREAMING <span>HOME HUB</span></h1>
        </div>
        <div class="user-welcome">
            <p><i class="fas fa-circle-user"></i> Cliente: <span id=\"user-display\">Cargando...</span></p>
            <a href="login.html" class="btn-logout" onclick="localStorage.removeItem('sesion_cliente')"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>
    </header>

    <main class="dash-container">
        <div class="dash-header">
            <h2><i class="fas fa-tv"></i> Mis Pantallas y Servicios Contratados</h2>
            <p>Haciendo clic sobre el correo o la contraseña puedes copiarlos automáticamente.</p>
        </div>

        <div id="grid-servicios" class="dash-grid">
            </div>
    </main>

    <script>
        // CONFIGURACIÓN DE TU NUEVO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBhJN3z0RKeVyKDILbJ5w6QpCuEKrW3P1E",
            authDomain: "streaming-home-hub-nuevo.firebaseapp.com",
            projectId: "streaming-home-hub-nuevo",
            storageBucket: "streaming-home-hub-nuevo.firebasestorage.app",
            messagingSenderId: "732477886674",
            appId: "1:732477886674:web:fb94a0498e8ec5cdda9d0b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", () => {
            let clienteLogueado = localStorage.getItem('sesion_cliente');
            if(!clienteLogueado) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-display').innerText = clienteLogueado.toUpperCase();
            let grid = document.getElementById('grid-servicios');

            db.collection("usuarios").doc(clienteLogueado).onSnapshot((doc) => {
                grid.innerHTML = '';
                if(!doc.exists || !doc.data().servicios || doc.data().servicios.length === 0) {
                    grid.innerHTML = `<p style="text-align:center; color:#8b8b9a; grid-column: 1/-1; padding: 40px 0;">No tienes servicios activos actualmente. Adquiere uno en nuestra tienda principal.</p>`;
                    return;
                }

                let servicios = doc.data().servicios;

                servicios.forEach(serv => {
                    let fVenc = new Date(serv.fechaVencimiento);
                    let hoy = new Date();
                    let difTiempo = fVenc.getTime() - hoy.getTime();
                    let diasRestantes = Math.ceil(difTiempo / (1000 * 60 * 60 * 24));

                    let badgeHTML = diasRestantes > 0 ? `<span class="badge-status active"><i class="fas fa-check-circle"></i> Activo (${diasRestantes} días)</span>` : `<span class="badge-status expired"><i class="fas fa-exclamation-circle"></i> Vencido</span>`;
                    let footerHTML = diasRestantes > 0 ? `<p class="venc-text">Vence el: ${fVenc.toLocaleDateString('es-ES')}</p>` : `<a href="https://wa.me/51916982923?text=Hola%20Streaming%20Home%20Hub,%20quiero%20renovar%20mi%20cuenta%20de%20${encodeURIComponent(serv.plataforma)}" target="_blank" class="btn-renew">Renovar Cuenta Ahora</a>`;

                    let pinStyle = (serv.perfilPin.toLowerCase() === 's/n' || serv.perfilPin === '') ? 'display:none;' : '';

                    let card = document.createElement('div');
                    card.className = 'dash-card';
                    card.innerHTML = `
                        <div class="dash-card-header">
                            <h3>${serv.plataforma}</h3>
                            ${badgeHTML}
                        </div>
                        <div class="dash-card-body">
                            <div class="credential-row">
                                <span><i class="fas fa-envelope"></i> Correo de Ingreso:</span>
                                <input type="text" value="${serv.accesoCorreo}" readonly onclick="this.select(); document.execCommand('copy');">
                            </div>
                            <div class="credential-row">
                                <span><i class="fas fa-key"></i> Contraseña de Acceso:</span>
                                <input type="text" value="${serv.accesoPass}" readonly onclick="this.select(); document.execCommand('copy');">
                            </div>
                            <div class="profile-info-box" style="${pinStyle}">
                                <div class="info-item">
                                    <span class="label">Perfil</span>
                                    <span class="value">${serv.perfilNombre}</span>
                                </div>
                                <div class="info-item">
                                    <span class="label">PIN</span>
                                    <span class="value-pin">${serv.perfilPin}</span>
                                </div>
                            </div>
                        </div>
                        <div class="dash-card-footer">
                            ${footerHTML}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }, err => {
                grid.innerHTML = `<p style="color:#ff0055; text-align:center;">Error de conexión.</p>`;
            });
        });
    </script>
</body>
</html>
