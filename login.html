<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamNeon - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class=\"login-body\">

    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver a la tienda</a>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1>STREAMING<span>HOME HUB</span></h1>
                <p>ZONA DE CLIENTES</p>
            </div>

            <form id="form-login" onsubmit="manejarLogin(event)">
                <div class="form-group">
                    <label for="login-user"><i class="fas fa-user"></i> Usuario o Teléfono:</label>
                    <input type="text" id="login-user" required placeholder="Ej: 916982923">
                </div>

                <div class="form-group">
                    <label for="login-pass"><i class="fas fa-lock"></i> Contraseña Web:</label>
                    <input type="password" id="login-pass" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-login-submit">Ingresar a mi Tablero <i class="fas fa-sign-in-alt"></i></button>
            </form>

            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Solicita tus accesos web oficiales al encargado de soporte técnico tras verificar tu pago.</p>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE TU NUEVO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBhJN3z0RKeVyKDILbJ5w6QpCuEKrW3P1E",
            authDomain: "streaming-home-hub-nuevo.firebaseapp.com",
            projectId: "streaming-home-hub-nuevo",
            storageBucket: "streaming-home-hub-nuevo.firebasestorage.app",
            messagingSenderId: "732477886674",
            appId: "1:732477886674:web:fb94a0498e8ec5cdda9d0b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function manejarLogin(event) {
            event.preventDefault();
            let user = document.getElementById('login-user').value.trim().toLowerCase();
            let pass = document.getElementById('login-pass').value.trim();
            
            db.collection("usuarios").doc(user).get().then((doc) => {
                if (doc.exists && doc.data().password === pass) {
                    localStorage.setItem('sesion_cliente', user);
                    window.location.href = 'dashboard.html';
                } else {
                    alert("Usuario o Contraseña incorrectos. Verifica o escribe a soporte.");
                }
            }).catch(err => {
                alert("Error al conectar con el servidor.");
            });
        }
    </script>
</body>
</html>
