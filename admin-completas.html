<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Cuentas Completas - STREAMING HOME HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK de Firebase Compat v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* DISEÑO ULTRA MINIMALISTA (Blanco, Negro y Grises) */
        :root {
            --bg-dark: #090909;
            --bg-card: #121212;
            --border-color: #262626;
            --border-focus: #ffffff;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
            --active-green: #00ff66;
            --inactive-red: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* PANTALLA DE INGRESO (LOGIN PROTECTOR) */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .login-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .login-box h2 span {
            color: var(--text-secondary);
        }

        /* HEADER */
        .header {
            background-color: #000000;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--text-secondary);
            font-weight: 300;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .nav-btn:hover {
            border-color: var(--border-focus);
            background-color: #ffffff;
            color: #000000;
        }

        /* CONTENEDOR PRINCIPAL */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 5%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .admin-container {
                grid-template-columns: 1fr;
            }
        }

        /* FORMULARIO DE REGISTRO */
        .panel-form {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .panel-form h2 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 4px;
            outline: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--border-focus);
        }

        .btn-submit {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #cccccc;
        }

        /* LISTADO DE CUENTAS COMPLETAS */
        .accounts-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }

        .accounts-section h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BARRA DE BÚSQUEDA */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
        }

        .search-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 35px !important;
            background-color: #000000;
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 4px;
            outline: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .search-input:focus {
            border-color: var(--border-focus);
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 20px;
        }

        @media (max-width: 550px) {
            .accounts-grid {
                grid-template-columns: 1fr;
            }
        }

        /* TARJETA DE CUENTA COMPLETA */
        .account-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .account-card:hover {
            border-color: #444444;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .platform-badge {
            font-size: 0.8rem;
            background-color: #ffffff;
            color: #000000;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-delete-account {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-delete-account:hover {
            color: var(--inactive-red);
        }

        .account-credentials {
            font-size: 0.9rem;
            margin-bottom: 15px;
            background-color: #000000;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #1c1c1e;
        }

        .credential-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .credential-item:last-child {
            margin-bottom: 0;
        }

        .credential-item span {
            color: var(--text-secondary);
        }

        .credential-item strong {
            cursor: pointer;
            transition: color 0.2s;
        }

        .credential-item strong:hover {
            color: var(--text-secondary);
            text-decoration: underline;
        }

        /* TABLA DE CLIENTES DENTRO DE LA CUENTA */
        .profiles-section {
            margin-top: 10px;
        }

        .profiles-section h3 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #171717;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .profile-name {
            font-weight: 600;
        }

        .profile-pin {
            color: var(--text-secondary);
            font-size: 0.75rem;
            background-color: #000000;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 5px;
        }

        .profile-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-active { background-color: var(--active-green); }
        .status-inactive { background-color: var(--inactive-red); }

        .days-text {
            font-weight: bold;
        }

        .btn-remove-profile {
            background: transparent;
            border: none;
            color: #555555;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            margin-left: 10px;
        }

        .btn-remove-profile:hover {
            color: var(--inactive-red);
        }

        /* INLINE FORM PARA AGREGAR CLIENTE */
        .add-profile-form {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: grid;
            grid-template-columns: 1fr 60px 55px 40px;
            gap: 8px;
        }

        .add-profile-form input {
            background-color: #000000;
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        .add-profile-form input:focus {
            border-color: var(--border-focus);
        }

        .btn-add-profile {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-add-profile:hover {
            background-color: #cccccc;
        }

        .no-profiles {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- CAPA PROTECTORA DE INICIO DE SESIÓN -->
    <div id="login-barrier" class="login-overlay">
        <div class="login-box">
            <h2>Stream Hub <span>Admin</span></h2>
            <form onsubmit="verificarAccesoPrivado(event)">
                <div class="form-group" style="text-align: left;">
                    <label>Usuario:</label>
                    <input type="text" id="barrier-user" required placeholder="Usuario administrador">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                    <label>Contraseña:</label>
                    <input type="password" id="barrier-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO GENERAL (OCULTO HASTA INICIAR SESIÓN) -->
    <div id="main-admin-content" class="hidden">
        <header class="header">
            <h1>Admin <span>Cuentas Completas</span></h1>
            <div>
                <a href="admin.html" class="nav-btn" style="margin-right: 10px;"><i class="fas fa-user-shield"></i> Admin Normal</a>
                <button onclick="cerrarSesionAdmin()" class="nav-btn" style="border-color: var(--inactive-red); color: var(--inactive-red); cursor: pointer;"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </header>

        <div class="admin-container">
            
            <!-- SECCIÓN DE REGISTRO (FORMULARIO) -->
            <div class="panel-form">
                <h2>Crear Cuenta Completa</h2>
                <form id="form-registro-completa" onsubmit="crearCuentaCompleta(event)">
                    <div class="form-group">
                        <label>Plataforma:</label>
                        <select id="cuenta-plataforma" required>
                            <option>Netflix Premium</option>
                            <option>Disney+</option>
                            <option>Max</option>
                            <option>Prime Video</option>
                            <option>Crunchyroll+</option>
                            <option>Spotify Premium</option>
                            <option>YouTube Premium</option>
                            <option>ChatGPT Plus</option>
                            <option>Canva Pro</option>
                            <option>CapCut Pro</option>
                            <option>Paramount+</option>
                            <option>Vix Premium</option>
                            <option>Apple TV+</option>
                            <option>IPTV</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Correo / Usuario:</label>
                        <input type="text" id="cuenta-correo" placeholder="ejemplo@cuenta.com" required>
                    </div>

                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="text" id="cuenta-pass" placeholder="ClaveSegura123" required>
                    </div>

                    <button type="submit" class="btn-submit"><i class="fas fa-plus"></i> Registrar Cuenta</button>
                </form>
            </div>

            <!-- SECCIÓN DE GRID DE CUENTAS ACTIVAS -->
            <div class="accounts-section">
                <div class="section-header-row">
                    <h2><i class="fas fa-folder"></i> Cuentas en Servicio</h2>
                    
                    <!-- BUSCADOR AGREGADO -->
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="buscador-completas" class="search-input" placeholder="Buscar por correo, plataforma o cliente..." oninput="filtrarCuentasCompletas()">
                    </div>
                </div>

                <div class="accounts-grid" id="grid-completas">
                    <p style="color: var(--text-secondary);">Conectando con la base de datos...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Configuración de Firebase - Utiliza tus credenciales exactas
        const firebaseConfig = {
            apiKey: "AIzaSyDBNxBidzO-jH7jJrFQzsz2JBDwpk2pDFo",
            authDomain: "streaming-home-hub.firebaseapp.com",
            projectId: "streaming-home-hub",
            storageBucket: "streaming-home-hub.firebasestorage.app",
            messagingSenderId: "541294461205",
            appId: "1:541294461205:web:bf0984d03dee964d52291c",
            measurementId: "G-0XGB3PBZXG"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Almacén local de datos descargados para permitir búsquedas instantáneas
        let cuentasLocalesCache = [];

        // 1. SISTEMA DE SEGURIDAD (USER: homehub | PASS: homehub2026)
        document.addEventListener("DOMContentLoaded", () => {
            const sesionActiva = sessionStorage.getItem("admin_completas_auth");
            if (sesionActiva === "granted") {
                mostrarPanelPrincipal();
            }
        });

        function verificarAccesoPrivado(e) {
            e.preventDefault();
            const user = document.getElementById("barrier-user").value.trim();
            const pass = document.getElementById("barrier-pass").value.trim();

            if (user === "homehub" && pass === "homehub2026") {
                sessionStorage.setItem("admin_completas_auth", "granted");
                mostrarPanelPrincipal();
            } else {
                alert("❌ Credenciales incorrectas. Acceso denegado.");
            }
        }

        function mostrarPanelPrincipal() {
            document.getElementById("login-barrier").classList.add("hidden");
            document.getElementById("main-admin-content").classList.remove("hidden");
            iniciarEscuchadorBaseDatos();
        }

        function cerrarSesionAdmin() {
            sessionStorage.removeItem("admin_completas_auth");
            window.location.reload();
        }

        // 2. ESCUCHAR CAMBIOS EN TIEMPO REAL
        function iniciarEscuchadorBaseDatos() {
            db.collection("cuentas_completas").onSnapshot((snapshot) => {
                cuentasLocalesCache = [];
                snapshot.forEach(doc => {
                    cuentasLocalesCache.push({ id: doc.id, ...doc.data() });
                });
                renderizarCuentas(cuentasLocalesCache);
            }, (error) => {
                console.error("Error al leer Firestore: ", error);
            });
        }

        // 3. CREAR NUEVA CUENTA COMPLETA
        function crearCuentaCompleta(e) {
            e.preventDefault();

            const plataforma = document.getElementById('cuenta-plataforma').value;
            const correo = document.getElementById('cuenta-correo').value.trim();
            const contrasena = document.getElementById('cuenta-pass').value.trim();

            db.collection("cuentas_completas").add({
                plataforma,
                correo,
                contrasena,
                clientes: [] // Lista de perfiles asignados vacía al inicio
            }).then(() => {
                document.getElementById('form-registro-completa').reset();
            }).catch(err => {
                alert("Error al guardar cuenta: " + err);
            });
        }

        // 4. BUSCADOR INTEGRADO (FILTRA SIN TOCAR LA BASE DE DATOS DE NUEVO)
        function filtrarCuentasCompletas() {
            const query = document.getElementById("buscador-completas").value.toLowerCase().trim();
            if (!query) {
                renderizarCuentas(cuentasLocalesCache);
                return;
            }

            const cuentasFiltradas = cuentasLocalesCache.filter(cuenta => {
                const plataformaMatch = cuenta.plataforma.toLowerCase().includes(query);
                const correoMatch = cuenta.correo.toLowerCase().includes(query);
                
                // Comprobar si coincide con el nombre de algún cliente dentro del array de clientes
                const clientesMatch = (cuenta.clientes || []).some(cli => 
                    cli.nombre.toLowerCase().includes(query)
                );

                return plataformaMatch || correoMatch || clientesMatch;
            });

            renderizarCuentas(cuentasFiltradas);
        }

        // 5. RENDERIZAR LISTADO DE CUENTAS
        function renderizarCuentas(listaCuentas) {
            const grid = document.getElementById('grid-completas');
            grid.innerHTML = '';

            if (listaCuentas.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-secondary); font-style: italic; grid-column: 1/-1;">No se encontraron cuentas que coincidan con la búsqueda.</p>';
                return;
            }

            listaCuentas.forEach((cuenta) => {
                const cuentaId = cuenta.id;
                const clientes = cuenta.clientes || [];

                const card = document.createElement('div');
                card.className = 'account-card';

                // Generar filas de clientes/perfiles asignados
                let listadoClientesHTML = '';
                if (clientes.length === 0) {
                    listadoClientesHTML = '<p class="no-profiles">No hay perfiles asignados aún.</p>';
                } else {
                    clientes.forEach((cli, idx) => {
                        const tiempoRestante = cli.vencimiento - Date.now();
                        const dias = Math.ceil(tiempoRestante / (1000 * 60 * 60 * 24));
                        const estaActivo = tiempoRestante > 0;
                        const dotClass = estaActivo ? 'status-active' : 'status-inactive';

                        // EXTRAER LA FECHA EXACTA EN FORMATO DD/MM
                        const fechaObj = new Date(cli.vencimiento);
                        const dia = String(fechaObj.getDate()).padStart(2, '0');
                        const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
                        const vencimientoLegible = `${dia}/${mes}`;

                        listadoClientesHTML += `
                            <div class="profile-row">
                                <div>
                                    <span class="profile-name">${cli.nombre}</span>
                                    ${cli.pin ? `<span class="profile-pin">PIN: ${cli.pin}</span>` : ''}
                                </div>
                                <div class="profile-status">
                                    <div class="status-dot ${dotClass}" title="${estaActivo ? 'Activo' : 'Inactivo'}"></div>
                                    <span class="days-text" style="color: ${estaActivo ? 'var(--active-green)' : 'var(--inactive-red)'}">
                                        Vence: ${vencimientoLegible}
                                    </span>
                                    <button class="btn-remove-profile" onclick="quitarPerfil('${cuentaId}', ${idx})" title="Quitar cliente">
                                        <i class="fas fa-user-minus"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="platform-badge">${cuenta.plataforma}</span>
                            <button class="btn-delete-account" onclick="eliminarCuenta('${cuentaId}')" title="Eliminar cuenta completa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>

                        <div class="account-credentials">
                            <div class="credential-item">
                                <span>Correo:</span>
                                <strong onclick="copiarTexto('${cuenta.correo}')">${cuenta.correo}</strong>
                            </div>
                            <div class="credential-item">
                                <span>Clave:</span>
                                <strong onclick="copiarTexto('${cuenta.contrasena}')">${cuenta.contrasena}</strong>
                            </div>
                        </div>

                        <div class="profiles-section">
                            <h3>Clientes Activos (${clientes.length})</h3>
                            <div class="profile-list">
                                ${listadoClientesHTML}
                            </div>
                        </div>
                    </div>

                    <!-- FORMULARIO INLINE PARA AGREGAR CLIENTES A ESTA CUENTA -->
                    <form class="add-profile-form" onsubmit="agregarPerfilAcuenta(event, '${cuentaId}')">
                        <input type="text" placeholder="Cliente" class="in-nombre" required>
                        <input type="text" placeholder="PIN" class="in-pin" maxlength="5">
                        <input type="number" placeholder="Días" class="in-dias" required value="30" min="1">
                        <button type="submit" class="btn-add-profile" title="Añadir Cliente">
                            <i class="fas fa-user-plus"></i>
                        </button>
                    </form>
                `;

                grid.appendChild(card);
            });
        }

        // 6. AGREGAR CLIENTE/PERFIL A UNA CUENTA ESPECÍFICA
        function agregarPerfilAcuenta(e, cuentaId) {
            e.preventDefault();
            const form = e.target;
            const nombre = form.querySelector('.in-nombre').value.trim();
            const pin = form.querySelector('.in-pin').value.trim();
            const dias = parseInt(form.querySelector('.in-dias').value) || 30;

            const timestampVencimiento = Date.now() + (dias * 24 * 60 * 60 * 1000);

            const nuevoCliente = {
                nombre,
                pin: pin || null,
                vencimiento: timestampVencimiento
            };

            const docRef = db.collection("cuentas_completas").doc(cuentaId);

            db.runTransaction((transaction) => {
                return transaction.get(docRef).then((doc) => {
                    if (!doc.exists) return;
                    let clientesActuales = doc.data().clientes || [];
                    clientesActuales.push(nuevoCliente);
                    transaction.update(docRef, { clientes: clientesActuales });
                });
            }).then(() => {
                form.reset();
                form.querySelector('.in-dias').value = 30; // Restaurar valor por defecto
            }).catch(err => alert("Error al añadir perfil: " + err));
        }

        // 7. QUITAR CLIENTE/PERFIL DE UNA CUENTA
        function quitarPerfil(cuentaId, index) {
            if (confirm("¿Estás seguro de quitar a este cliente de esta cuenta completa?")) {
                const docRef = db.collection("cuentas_completas").doc(cuentaId);

                db.runTransaction((transaction) => {
                    return transaction.get(docRef).then((doc) => {
                        if (!doc.exists) return;
                        let clientesActuales = doc.data().clientes || [];
                        clientesActuales.splice(index, 1);
                        transaction.update(docRef, { clientes: clientesActuales });
                    });
                }).catch(err => alert("Error al remover perfil: " + err));
            }
        }

        // 8. ELIMINAR CUENTA COMPLETA ENTERA
        function eliminarCuenta(cuentaId) {
            if (confirm("🚨 ATENCIÓN: ¿Estás totalmente seguro de eliminar esta cuenta completa junto con todos sus perfiles asignados?")) {
                db.collection("cuentas_completas").doc(cuentaId).delete()
                    .catch(err => alert("Error al borrar cuenta: " + err));
            }
        }

        // 9. FUNCIÓN UTILITARIA PARA COPIAR TEXTO AL PORTAPAPELES
        function copiarTexto(texto) {
            const aux = document.createElement("input");
            aux.setAttribute("value", texto);
            document.body.appendChild(aux);
            aux.select();
            document.execCommand("copy");
            document.body.removeChild(aux);
            
            // Alerta discreta
            alert("Copiado al portapapeles: " + texto);
        }
    </script>
</body>
</html>
